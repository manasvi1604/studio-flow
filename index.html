<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#10131b"/><title>Studio Flow — Content Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{font-family:'DM Sans',sans-serif;color:#f0f1f5;background:#0d1017;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#b4a5ff} .app{display:flex;min-height:100vh}.side{width:244px;background:#11151e;border-right:1px solid #252936;padding:29px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:36px}.logo{display:flex;align-items:center;gap:12px;padding:4px 14px;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.9px}.logomark{background:#bcacff;color:#171321;display:grid;place-items:center;border-radius:12px;width:37px;height:37px;font-weight:700;font-size:21px}.logodot{color:#b6a2ff}.side-label{padding:0 14px;margin-bottom:10px;color:#687083;letter-spacing:1.5px;font-size:10px;font-weight:700}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;color:#9ca3b3;border:0;text-align:left;display:flex;gap:13px;align-items:center;padding:13px 15px;border-radius:11px;font-size:13px;font-weight:600}.nav button.active{background:#272338;color:#d6c9ff}.nav button:hover{background:#252a35;color:#fff}.nav .ico{font-size:17px;width:19px;text-align:center}.sidebar-footer{margin-top:auto;padding:15px;border:1px solid #2b303e;border-radius:14px;background:#171c26}.sidebar-footer strong{font-size:12px}.sidebar-footer p{font-size:11px;color:#9299a9;line-height:1.6;margin:6px 0 0}.main{width:calc(100% - 244px);max-width:1600px;margin:auto;padding:30px 40px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:33px;gap:20px}.eyebrow{color:#ad9bf4;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin:0 0 6px}.heading{font-family:'Space Grotesk';font-size:31px;letter-spacing:-1.3px;margin:0;font-weight:700}.sub{font-size:13px;color:#848c9f;margin:8px 0 0}.top-actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid #353b49;border-radius:10px;padding:11px 15px;background:#1c222e;color:#e5e8ee;font-size:12px;font-weight:700}.btn.primary{background:#b6a2ff;color:#171321;border-color:#b6a2ff}.btn:hover{filter:brightness(1.12)}.btn.danger{color:#ffb4b4}.grid{display:grid;gap:17px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:24px}.card{background:#161b25;border:1px solid #292f3c;border-radius:17px;padding:23px}.metric-label{color:#a0a6b6;font-size:12px}.metric-value{font-family:'Space Grotesk';font-weight:700;letter-spacing:-1px;font-size:35px;margin:15px 0 7px}.metric-foot{font-size:11px;color:#8b92a3}.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:7px;background:#28243b;color:#c9baff;font-size:10px;font-weight:700}.tag.teal{background:#163731;color:#7de0c0}.tag.rose{background:#3b2832;color:#efb0c3}.tag.gold{background:#403624;color:#f0cc86}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}.two{grid-template-columns:1.4fr 1fr}.section-title{font-family:'Space Grotesk';font-size:17px;letter-spacing:-.4px;margin:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:19px}.section-head small{color:#788293}.progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:11px}.progress-label b{color:#d7d9e4}.track{height:8px;background:#303541;border-radius:20px;overflow:hidden;margin-bottom:23px}.fill{height:100%;background:#b6a2ff;border-radius:20px}.fill.teal{background:#63d6b8}.task{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0;border-bottom:1px solid #292f3a}.task:last-child{border-bottom:0}.task-title{font-size:12px;font-weight:700}.task-sub{font-size:11px;color:#81899a;margin-top:6px}.task-right{display:flex;align-items:center;gap:10px}.muted{color:#868fa1;font-size:12px}.pill{font-size:10px;padding:6px 9px;border-radius:100px;background:#292e3c;color:#c5cada;white-space:nowrap}.pill.published{color:#7ee0c0;background:#18392f}.pill.scheduled{color:#d0bdff;background:#322746}.pill.edit{color:#efca8b;background:#3a3021}.pill.idea{color:#abc4e7;background:#273345}.pill.script{color:#ffb7c6;background:#402b39}.cal-controls{display:flex;gap:7px;align-items:center}.iconbtn{height:31px;min-width:31px;background:#232937;color:#c9cdda;border:1px solid #333947;border-radius:8px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;font-size:10px;color:#767f91;padding-bottom:7px}.day{border:1px solid #303544;min-height:88px;border-radius:9px;padding:8px;background:#1a202a;overflow:hidden}.day.other{opacity:.35}.day.today{border-color:#b6a2ff}.date-num{font-size:11px;color:#a3acbc;margin-bottom:8px}.cal-item{display:block;width:100%;text-align:left;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;padding:5px 6px;border-radius:4px;margin-bottom:4px;background:#302949;color:#d9c9ff}.cal-item.post{background:#1a3936;color:#91e4d1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th{color:#818a9c;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:14px;border-bottom:1px solid #333947}td{border-bottom:1px solid #282e39;padding:16px 14px;font-size:12px;color:#cbd0dd}tr:last-child td{border-bottom:0}.item-title{font-weight:700;color:#f1f2f5}.item-sub{color:#767f91;font-size:11px;margin-top:4px}.type{color:#c9b9ff}.type.post{color:#7ddbc4}.actions{display:flex;gap:5px}.actions button{border:1px solid #353a49;border-radius:7px;padding:6px 8px;background:#222936;color:#c6cbd6;font-size:11px}.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.field,.toolbar select,.toolbar input{padding:11px 13px;background:#1c222e;color:#e6e8ee;border:1px solid #363c4a;border-radius:9px;outline:none;font-size:12px}.toolbar input{min-width:220px}.empty{padding:30px;text-align:center;color:#8590a2;font-size:12px}.hidden{display:none!important}.modal-bg{position:fixed;inset:0;background:#080a0fcc;display:grid;place-items:center;z-index:10;padding:16px}.modal{background:#1b202a;border:1px solid #3a4050;border-radius:20px;padding:28px;width:min(590px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 80px #0008}.modal h2{font-family:'Space Grotesk';margin:0 0 22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form-group{display:flex;flex-direction:column;gap:7px}.form-group.wide{grid-column:1/-1}.form-group label{font-size:11px;color:#aab1c1}.form-group textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;justify-content:space-between;margin-top:20px;gap:8px}.mini-note{border:1px solid #353a47;background:#212634;padding:13px;border-radius:10px;font-size:11px;color:#adb4c2;line-height:1.7}.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.settings-grid input{width:100%}.overline{font-size:10px;color:#9e8cdc;font-weight:700;text-transform:uppercase;letter-spacing:1.3px}.analytics-bar{height:10px;background:#303644;border-radius:8px;overflow:hidden;margin-top:8px}.analytics-bar div{height:100%;background:#9c88e8}.footnote{font-size:11px;color:#838c9d;line-height:1.7}.empty-ill{font-size:25px;margin-bottom:10px}@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.main{padding:24px}.side{width:204px}.main{width:calc(100% - 204px)}}@media(max-width:720px){.app{display:block}.side{position:static;width:100%;height:auto;padding:13px;border-right:0;border-bottom:1px solid #333}.logo{font-size:18px}.side-label,.sidebar-footer{display:none}.nav{flex-direction:row;overflow:auto;padding-bottom:2px}.nav button{white-space:nowrap;padding:10px;font-size:11px}.nav .ico{display:none}.main{width:100%;padding:22px 14px}.top{align-items:flex-start}.heading{font-size:25px}.top-actions{flex-direction:column}.metrics{gap:9px}.card{padding:16px}.metric-value{font-size:28px}.day{min-height:67px;padding:4px}.date-num{font-size:9px}.cal-item{font-size:8px;padding:4px}.form-grid,.settings-grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="addons.css"></head><body><div class="app"><aside class="side"><div class="logo"><div class="logomark">✳</div> studio<span class="logodot">flow.</span></div><div><div class="side-label">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-page="overview"><span class="ico">◫</span>Overview</button><button data-page="studio"><span class="ico">✦</span>AI Studio</button><button data-page="pipeline"><span class="ico">▦</span>Content Pipeline</button><button data-page="calendar"><span class="ico">▤</span>Calendar</button><button data-page="ideas"><span class="ico">✧</span>Idea Bank</button><button data-page="analytics"><span class="ico">◷</span>Performance</button><button data-page="settings"><span class="ico">⚙</span>Settings & Backup</button></nav><div id="authArea" class="auth-area"></div></div><div class="sidebar-footer"><strong>✦ Keep the rhythm.</strong><p>Two reels a week. Eight posts a month. One organized creative workflow.</p></div></aside><main class="main"><header class="top"><div><p class="eyebrow">CONTENT COMMAND CENTER</p><h1 class="heading" id="pageTitle">Your creative overview</h1><p class="sub" id="pageSub">Plan it. Make it. Post it. Repeat.</p></div><div class="top-actions"><button class="btn" id="exportQuick">↓ Export backup</button><button class="btn primary" id="newContent">＋ New content</button></div></header><div id="pageContent"></div></main></div><div id="modal" class="modal-bg hidden"><div class="modal"><h2 id="modalTitle">New content</h2><form id="contentForm"><input type="hidden" name="id"><div class="form-grid"><div class="form-group wide"><label>Content title *</label><input name="title" class="field" required placeholder="e.g. Fixing my own packaging"></div><div class="form-group"><label>Content type</label><select name="type" class="field"><option>Reel</option><option>Post</option></select></div><div class="form-group"><label>Category</label><select name="category" class="field"><option>Project Diaries</option><option>Designer Problems</option><option>Learning in Public</option><option>Behind the Design</option><option>Portfolio / Work</option><option>Other</option></select></div><div class="form-group"><label>Publishing date</label><input type="date" name="date" class="field"></div><div class="form-group"><label>Production status</label><select name="status" class="field"><option>Idea</option><option>Script</option><option>Shoot</option><option>Edit</option><option>Review</option><option>Scheduled</option><option>Published</option></select></div><div class="form-group wide"><label>Series / part (optional)</label><input name="series" class="field" placeholder="e.g. Packaging Diary · Part 1"></div><div class="form-group wide"><label>Notes / hook / caption</label><textarea name="notes" class="field" placeholder="What is this piece about?"></textarea></div><div class="form-group wide"><label>Asset or published link</label><input name="link" type="url" class="field" placeholder="https://..."></div><div class="form-group"><label>Views</label><input name="views" type="number" min="0" class="field" placeholder="0"></div><div class="form-group"><label>Engagements (likes + comments + shares + saves)</label><input name="engagements" type="number" min="0" class="field" placeholder="0"></div></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button type="submit" class="btn primary">Save content</button></div></form></div></div><script>
const KEY='studioflow-v1', SETTINGS='studioflow-settings-v1';let items=read(KEY,[]),cfg=read(SETTINGS,{reelsWeekly:2,postsMonthly:8,reelDays:[2,5]}),page='overview',monthOffset=0,filterType='All',filterStatus='All',searchText='';const statuses=['Idea','Script','Shoot','Edit','Review','Scheduled','Published'];const today=new Date();today.setHours(0,0,0,0);function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}function persist(){localStorage.setItem(KEY,JSON.stringify(items))}function saveSettings(){localStorage.setItem(SETTINGS,JSON.stringify(cfg))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function monthStart(offset=0){return new Date(today.getFullYear(),today.getMonth()+offset,1)}function keyDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function labelDate(s){if(!s)return 'Not scheduled';let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}function inMonth(i,off=0){if(!i.date)return false;return i.date.startsWith(keyDate(monthStart(off)).slice(0,7))}function nextDate(dow){let d=new Date(today);d.setDate(d.getDate()+(dow-d.getDay()+7)%7);return keyDate(d)}function thisWeek(i){if(!i.date)return false;let d=new Date(i.date+'T00:00:00');let start=new Date(today);start.setDate(start.getDate()-(start.getDay()+6)%7);let end=new Date(start);end.setDate(start.getDate()+7);return d>=start&&d<end}function published(i){return i.status==='Published'}function calc(){return {reels:items.filter(i=>i.type==='Reel'&&inMonth(i)&&published(i)).length,posts:items.filter(i=>i.type==='Post'&&inMonth(i)&&published(i)).length,queue:items.filter(i=>i.status!=='Published').length,scheduled:items.filter(i=>i.status==='Scheduled').length}}function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.getElementById('newContent').onclick=()=>openModal();document.getElementById('exportQuick').onclick=exportBackup;document.getElementById('cancelModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};function tag(status){let k=status.toLowerCase();return `<span class="pill ${esc(k)}">${esc(status)}</span>`}function typeTag(type){return `<span class="tag ${type==='Post'?'teal':''}"><span class="dot"></span>${esc(type)}</span>`}function progress(label,count,target,color=''){return `<div class="progress-label"><span>${esc(label)}</span><b>${count} / ${target}</b></div><div class="track"><div class="fill ${color}" style="width:${Math.min(100,100*count/Math.max(1,target))}%"></div></div>`}function title(t,s){document.getElementById('pageTitle').textContent=t;document.getElementById('pageSub').textContent=s}function render(){const root=document.getElementById('pageContent');if(page==='overview'){title('Your creative overview','One place for every reel, post and publishing deadline.');root.innerHTML=overview()}if(page==='pipeline'){title('Content pipeline','Everything moving from an idea to a published piece.');root.innerHTML=pipeline()}if(page==='calendar'){title('Publishing calendar','See your content plan at a glance.');root.innerHTML=`<div class="card">${calendarHtml()}</div>`}if(page==='ideas'){title('Idea bank','A home for ideas before they turn into content.');root.innerHTML=ideas()}if(page==='analytics'){title('Performance','Measure what resonates and improve your next piece.');root.innerHTML=analytics()}if(page==='settings'){title('Settings & backup','Make the system fit your publishing routine.');root.innerHTML=settingsHtml()}bindPage()}
function overview(){let c=calc(),upcoming=items.filter(i=>i.date&&i.status!=='Published').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);return `<div class="grid metrics"><div class="card"><div class="metric-label">Reels published this month</div><div class="metric-value">${c.reels}<span class="muted"> / ${cfg.reelsWeekly*4}*</span></div><div class="metric-foot">Target: ${cfg.reelsWeekly} per week</div></div><div class="card"><div class="metric-label">Posts published this month</div><div class="metric-value">${c.posts}<span class="muted"> / ${cfg.postsMonthly}</span></div><div class="metric-foot">Monthly feed-post target</div></div><div class="card"><div class="metric-label">In production</div><div class="metric-value">${c.queue}</div><div class="metric-foot">Ideas, scripts, shoots and edits</div></div><div class="card"><div class="metric-label">Ready to publish</div><div class="metric-value">${c.scheduled}</div><div class="metric-foot">Pieces marked scheduled</div></div></div><div class="grid two"><div class="card"><div class="section-head"><h2 class="section-title">Monthly publishing goals</h2><span class="tag">${monthStart().toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span></div>${progress('Reels published',c.reels,cfg.reelsWeekly*4)}${progress('Posts published',c.posts,cfg.postsMonthly,'teal')}<div class="mini-note">✦ Reel monthly goal is shown as a four-week benchmark. Actual month totals vary depending on the weekday calendar.</div></div><div class="card"><div class="section-head"><h2 class="section-title">Coming up next</h2><button class="btn" data-go="pipeline">View pipeline</button></div>${upcoming.length?upcoming.map(i=>`<div class="task"><div><div class="task-title">${esc(i.title)}</div><div class="task-sub">${labelDate(i.date)} · ${esc(i.type)}</div></div><div class="task-right">${tag(i.status)}<button class="iconbtn" data-edit="${esc(i.id)}">↗</button></div></div>`).join(''):'<div class="empty"><div class="empty-ill">✦</div>Nothing is scheduled yet. Add your first piece of content.</div>'}</div></div><div class="card" style="margin-top:18px"><div class="section-head"><h2 class="section-title">Publishing calendar</h2><button class="btn" data-go="calendar">Full calendar ↗</button></div>${calendarHtml(true)}</div>`}
function itemRows(source){return source.map(i=>`<tr><td><div class="item-title">${esc(i.title)}</div><div class="item-sub">${esc(i.series||i.category||'')}</div></td><td>${typeTag(i.type)}</td><td>${tag(i.status)}</td><td>${labelDate(i.date)}</td><td><div class="actions"><button data-edit="${esc(i.id)}">Edit</button><button data-delete="${esc(i.id)}">Delete</button></div></td></tr>`).join('')}
function pipeline(){let filtered=items.filter(i=>(filterType==='All'||i.type===filterType)&&(filterStatus==='All'||i.status===filterStatus)&&(`${i.title} ${i.category} ${i.series||''}`).toLowerCase().includes(searchText.toLowerCase())).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `<div class="card"><div class="toolbar"><input id="search" placeholder="Search content..." value="${esc(searchText)}"/><select id="typeFilter"><option>All</option><option>Reel</option><option>Post</option></select><select id="statusFilter"><option>All</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select><span class="muted" style="margin:auto 0 auto auto">${filtered.length} items</span></div><div class="table-wrap"><table><thead><tr><th>Content</th><th>Type</th><th>Status</th><th>Publish date</th><th>Actions</th></tr></thead><tbody>${itemRows(filtered)}</tbody></table>${filtered.length?'':'<div class="empty">No matching content. Add a new reel or post to get started.</div>'}</div></div>`}
function calendarHtml(compact=false){let current=monthStart(monthOffset),year=current.getFullYear(),month=current.getMonth(),offset=(current.getDay()+6)%7,days=new Date(year,month+1,0).getDate();let html=`<div class="section-head"><h2 class="section-title">${current.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2><div class="cal-controls"><button class="iconbtn" data-month="-1">‹</button><button class="iconbtn" data-month="0">Today</button><button class="iconbtn" data-month="1">›</button></div></div><div class="cal-grid">${['M','T','W','T','F','S','S'].map(x=>`<div class="weekday">${x}</div>`).join('')}`;for(let idx=0;idx<Math.ceil((offset+days)/7)*7;idx++){let date=idx-offset+1,valid=date>0&&date<=days;let d=new Date(year,month,date),iso=keyDate(d),dayitems=valid?items.filter(i=>i.date===iso):[];html+=`<div class="day ${valid?'':'other'} ${iso===keyDate(today)?'today':''}"><div class="date-num">${valid?date:''}</div>${dayitems.slice(0,compact?2:4).map(i=>`<button title="${esc(i.title)}" class="cal-item ${i.type==='Post'?'post':''}" data-edit="${esc(i.id)}">${i.type==='Reel'?'●':'◆'} ${esc(i.title)}</button>`).join('')}${dayitems.length>(compact?2:4)?`<div class="muted">+${dayitems.length-(compact?2:4)} more</div>`:''}</div>`}return html+'</div><p class="footnote">Purple = Reels · Teal = Posts · Click any item to edit its details.</p>'}
function ideas(){let ideas=items.filter(i=>i.status==='Idea');return `<div class="card"><div class="section-head"><h2 class="section-title">Unscheduled thoughts & future concepts</h2><span class="tag">${ideas.length} ideas</span></div>${ideas.length?`<div class="table-wrap"><table><thead><tr><th>Idea</th><th>Type</th><th>Status</th><th>Planned date</th><th>Actions</th></tr></thead><tbody>${itemRows(ideas)}</tbody></table></div>`:'<div class="empty"><div class="empty-ill">✧</div>Save ideas here by creating content with the status “Idea”.</div>'}</div>`}
function analytics(){let done=items.filter(i=>published(i)),reels=done.filter(i=>i.type==='Reel'),posts=done.filter(i=>i.type==='Post'),totalViews=done.reduce((a,i)=>a+(Number(i.views)||0),0),totalEng=done.reduce((a,i)=>a+(Number(i.engagements)||0),0),best=[...done].sort((a,b)=>(Number(b.views)||0)-(Number(a.views)||0)).slice(0,5);return `<div class="grid metrics"><div class="card"><div class="metric-label">Published pieces</div><div class="metric-value">${done.length}</div><div class="metric-foot">${reels.length} reels · ${posts.length} posts</div></div><div class="card"><div class="metric-label">Total recorded views</div><div class="metric-value">${totalViews.toLocaleString('en-IN')}</div><div class="metric-foot">Across published content</div></div><div class="card"><div class="metric-label">Total engagements</div><div class="metric-value">${totalEng.toLocaleString('en-IN')}</div><div class="metric-foot">Manually entered</div></div><div class="card"><div class="metric-label">Avg views / piece</div><div class="metric-value">${done.length?Math.round(totalViews/done.length).toLocaleString('en-IN'):0}</div><div class="metric-foot">Based on recorded metrics</div></div></div><div class="card"><div class="section-head"><h2 class="section-title">Top-performing content</h2></div>${best.length?best.map((i,k)=>`<div class="task"><div><div class="task-title">${k+1}. ${esc(i.title)}</div><div class="task-sub">${esc(i.type)} · ${labelDate(i.date)}</div></div><div class="muted">${(Number(i.views)||0).toLocaleString('en-IN')} views</div></div>`).join(''):'<div class="empty">Once you publish content and enter views, your best-performing reels and posts will appear here.</div>'}</div><p class="footnote">Performance is entered manually; Instagram and other platforms are not connected.</p>`}
function settingsHtml(){return `<div class="settings-grid"><div class="card"><h2 class="section-title">Publishing targets</h2><p class="footnote">Edit your cadence here. Targets update throughout the dashboard.</p><div class="form-group" style="margin-top:20px"><label>Reels per week</label><input id="weeklyTarget" type="number" min="1" max="14" class="field" value="${cfg.reelsWeekly}"></div><div class="form-group" style="margin-top:16px"><label>Posts per month</label><input id="postTarget" type="number" min="0" max="100" class="field" value="${cfg.postsMonthly}"></div><button class="btn primary" style="margin-top:20px" id="saveTargets">Save targets</button></div><div class="card"><h2 class="section-title">Data & backup</h2><p class="footnote">Your data is saved in this browser on this device, not in a hosted database. Export it regularly to preserve your work.</p><div style="display:flex;flex-direction:column;align-items:start;gap:12px;margin-top:20px"><button class="btn" id="exportBackup">↓ Export JSON backup</button><button class="btn" id="exportCSV">↓ Export content CSV</button><label class="btn" for="importFile" style="cursor:pointer">↑ Import JSON backup</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"/><button class="btn danger" id="clearData">Clear all content</button></div></div></div><div class="card" style="margin-top:18px"><h2 class="section-title">Hosting note</h2><p class="footnote">This version is a standalone Netlify-ready static site. Netlify hosts the interface, while content entries are stored via your browser's local storage. To sync across devices or multiple users, a separate authenticated database (for example Supabase) must be connected in a future version.</p></div>`}
function bindPage(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>setPage(x.dataset.go));document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>openModal(x.dataset.edit));document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{if(confirm('Delete this content item?')){items=items.filter(i=>i.id!==x.dataset.delete);persist();render()}});document.querySelectorAll('[data-month]').forEach(x=>x.onclick=()=>{monthOffset=x.dataset.month==='0'?0:monthOffset+Number(x.dataset.month);render()});let sf=document.getElementById('search');if(sf)sf.oninput=e=>{searchText=e.target.value;let s=e.target.selectionStart;render();let inp=document.getElementById('search');inp.focus();inp.setSelectionRange(s,s)};let tf=document.getElementById('typeFilter');if(tf){tf.value=filterType;tf.onchange=e=>{filterType=e.target.value;render()}}let st=document.getElementById('statusFilter');if(st){st.value=filterStatus;st.onchange=e=>{filterStatus=e.target.value;render()}}let save=document.getElementById('saveTargets');if(save)save.onclick=()=>{cfg.reelsWeekly=Math.max(1,Number(document.getElementById('weeklyTarget').value)||2);cfg.postsMonthly=Math.max(0,Number(document.getElementById('postTarget').value)||0);saveSettings();render()};let exp=document.getElementById('exportBackup');if(exp)exp.onclick=exportBackup;let csv=document.getElementById('exportCSV');if(csv)csv.onclick=exportCSV;let file=document.getElementById('importFile');if(file)file.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let raw=JSON.parse(await f.text());if(!Array.isArray(raw.items))throw Error('Invalid backup');if(!confirm('Replace existing dashboard content with this backup?'))return;items=raw.items;cfg={...cfg,...(raw.settings||{})};persist();saveSettings();render();alert('Backup imported successfully.')}catch(err){alert('Could not import backup: '+err.message)}};let clear=document.getElementById('clearData');if(clear)clear.onclick=()=>{if(confirm('This permanently removes all dashboard items saved in this browser. Continue?')){items=[];persist();render()}}}
function openModal(id){const form=document.getElementById('contentForm');form.reset();let item=id?items.find(i=>i.id===id):null;document.getElementById('modalTitle').textContent=item?'Edit content':'New content';if(item)Object.keys(item).forEach(k=>{if(form.elements[k])form.elements[k].value=item[k]??''});else{form.elements.status.value='Idea';form.elements.type.value='Reel'}document.getElementById('modal').classList.remove('hidden');form.elements.title.focus()}function closeModal(){document.getElementById('modal').classList.add('hidden')}document.getElementById('contentForm').addEventListener('submit',e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.title=data.title.trim();if(!data.title)return;if(data.id){let idx=items.findIndex(i=>i.id===data.id);if(idx>=0)items[idx]={...items[idx],...data}}else{data.id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));items.push(data)}persist();closeModal();render()});function download(name,contents,type){let blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportBackup(){download('studio-flow-backup.json',JSON.stringify({version:1,exported:new Date().toISOString(),settings:cfg,items},null,2),'application/json')}function exportCSV(){let fields=['title','type','category','date','status','series','notes','link','views','engagements'];let csv=[fields.join(','),...items.map(i=>fields.map(k=>'"'+String(i[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');download('studio-flow-content.csv',csv,'text/csv;charset=utf-8')}render();
</script><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script><script src="addons.js" defer></script></body></html>
